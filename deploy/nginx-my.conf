# ============================================================================
# my.prodeklarant.uz — MIJOZ PORTALI (alohida origin)
# ============================================================================
# Serverda: /etc/nginx/sites-available/my.prodeklarant.uz  (sites-enabled'ga ulang)
#
# Oldindan:
#   1) DNS: my.prodeklarant.uz  A  46.8.114.92  (TTL past)
#   2) Build:  cd frontend && npm run build:portal
#      Natija frontend/dist-portal/ ni /var/www/app/frontend/dist-portal/ ga joylang.
#   3) Sertifikat:  sudo certbot --nginx -d my.prodeklarant.uz
#      (certbot quyidagi 443 blokiga ssl_certificate qatorlarini o'zi qo'shadi;
#       birinchi marta faqat 80-blok bilan ishga tushirib, keyin 443 ni oching)
#
# Qo'llash:   sudo nginx -t && sudo systemctl reload nginx
# Tekshirish:
#   curl -sI https://my.prodeklarant.uz/            | grep -i -E "HTTP|x-robots"
#   curl -s  -o /dev/null -w "%{http_code}\n" https://my.prodeklarant.uz/api/tasks     # 404 bo'lishi SHART
#   curl -s  -o /dev/null -w "%{http_code}\n" https://my.prodeklarant.uz/api/portal/shipments   # 401 (token yo'q)
#
# Xavfsizlik: bu hostda FAQAT /api/portal/ backend'ga o'tadi. Xodimlar API'si
# (/api/tasks, /api/auth/login, ...) bu domen orqali ochilmaydi.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name my.prodeklarant.uz;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;            # nginx 1.24 (Ubuntu 24.04): `http2 on;` yo'q, listen'da
    listen [::]:443 ssl http2;
    server_name my.prodeklarant.uz;

    # certbot qo'shadi:
    # ssl_certificate     /etc/letsencrypt/live/my.prodeklarant.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/my.prodeklarant.uz/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/app/frontend/dist-portal;

    # Qidiruv tizimlaridan yopish + xavfsizlik sarlavhalari.
    # ESLATMA: ichki `location`da add_header bo'lsa, bu qatorlar o'sha blokka ham ko'chirilishi kerak
    # (nginx ichki add_header tashqaridagilarni bekor qiladi) — shuning uchun `include` ishlatilgan.
    include /etc/nginx/snippets/my-portal-headers.conf;

    client_max_body_size 1m;   # portal fayl yuklamaydi (MVP: faqat ko'rish/yuklab olish)

    # --- API: faqat mijoz portali prefiksi ---
    location /api/portal/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/my-portal-headers.conf;
    }
    location /api/ { return 404; }

    # --- Statik fayllar (hash'li nomlar — uzoq kesh) ---
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/my-portal-headers.conf;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        include /etc/nginx/snippets/my-portal-headers.conf;
    }

    # --- SPA: boshqa hamma yo'l portal.html (login, /shipments/12, /documents ...) ---
    location / {
        try_files $uri /portal.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/my-portal-headers.conf;
    }
}

# ============================================================================

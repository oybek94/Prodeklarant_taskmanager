# ============================================================================
# app.prodeklarant.uz — qidiruv tizimlaridan to'liq yopish
# ============================================================================
# Serverda: /etc/nginx/sites-available/<app.prodeklarant.uz konfiguratsiyasi>
# Quyidagi qatorlarni `server { ... }` blokining ICHIGA qo'ying.
#
# `always` bayrog'i muhim: usiz header faqat 2xx/3xx javoblarga qo'shiladi,
# 404 va 500 sahifalar esa noindex'siz qoladi.
# ----------------------------------------------------------------------------

    # Har bir javobga (HTML, JSON, PDF, rasm, xato sahifalari) noindex
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # Referrer orqali sayt manzili tashqi saytlarning analitikasiga tushmasin
    add_header Referrer-Policy "no-referrer" always;

    # robots.txt aynan fayldan berilsin — SPA fallback'ga tushib
    # index.html qaytarmasin (hozirgi xatolik shu edi)
    location = /robots.txt {
        root /var/www/app/frontend/dist;   # <-- dist yo'lini o'zingiznikiga moslang
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files /robots.txt =404;
    }

    # Google/Yandex saytni tasdiqlash fayllarini so'rasa — 404
    location = /sitemap.xml { return 404; }

# ----------------------------------------------------------------------------
# ESLATMA: agar `server` blokida boshqa joyda ham `add_header` bo'lsa,
# nginx'da ichki blokdagi add_header TASHQI blokdagilarni BEKOR QILADI.
# Ya'ni har bir `location { ... }` da o'z add_header'i bo'lsa, unga ham
# yuqoridagi X-Robots-Tag qatorini nusxalash kerak.
#
# Qo'llash:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Tekshirish:
#   curl -sSI https://app.prodeklarant.uz/ | grep -i x-robots-tag
#   curl -sS  https://app.prodeklarant.uz/robots.txt | head -3
# ============================================================================
